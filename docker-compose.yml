services:
  # Single-node Kafka broker, KRaft mode (no ZooKeeper needed). This is the
  # one piece that's genuinely annoying to install by hand - Compose turns it
  # into a 30-second `docker compose up`.
  kafka:
    image: apache/kafka:3.7.0
    container_name: target-pipeline-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Convenience for a demo repo only - a real cluster creates topics
      # explicitly (see run_pipeline.sh) so partition count is a deliberate
      # choice, not whatever the first producer happened to trigger.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 20

  # PySpark + the pipeline code. Waits for Kafka, then runs producer ->
  # consumer -> EDA -> analysis -> Hive registration, end to end.
  pipeline:
    build: .
    container_name: target-pipeline-app
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    volumes:
      # Mount output/ so the Hive warehouse and gold tables survive after the
      # container exits, and are inspectable from the host.
      - ./output:/app/output
