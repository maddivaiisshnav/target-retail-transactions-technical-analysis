<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#5B6472"/>
    </marker>
  </defs>

  <rect width="1200" height="460" fill="#FFFFFF"/>

  <!-- source -->
  <rect x="20" y="180" width="140" height="100" rx="10" fill="#F4F7FA" stroke="#E3E9EF"/>
  <text x="90" y="222" font-size="14" font-weight="bold" text-anchor="middle" fill="#1B1F2A">CSV</text>
  <text x="90" y="242" font-size="11" text-anchor="middle" fill="#5B6472">1,000 orders</text>
  <text x="90" y="257" font-size="11" text-anchor="middle" fill="#5B6472">(simulated stream)</text>
  <line x1="160" y1="230" x2="215" y2="230" stroke="#5B6472" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- kafka -->
  <rect x="220" y="140" width="220" height="180" rx="12" fill="#065A82"/>
  <text x="330" y="175" font-size="18" font-weight="bold" text-anchor="middle" fill="#FFFFFF">KAFKA</text>
  <text x="330" y="195" font-size="11" font-style="italic" text-anchor="middle" fill="#CFE3EC">transport</text>
  <text x="330" y="225" font-size="11" text-anchor="middle" fill="#E3F0F6">topic: target_orders</text>
  <text x="330" y="245" font-size="11" text-anchor="middle" fill="#E3F0F6">3 partitions, keyed by state</text>
  <text x="330" y="272" font-size="11" text-anchor="middle" fill="#9FD3E8">producer.py</text>
  <text x="330" y="290" font-size="11" text-anchor="middle" fill="#9FD3E8">consumer.py</text>
  <text x="330" y="308" font-size="11" text-anchor="middle" fill="#9FD3E8">streaming_consumer.py</text>
  <line x1="440" y1="230" x2="495" y2="230" stroke="#5B6472" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- spark -->
  <rect x="500" y="140" width="220" height="180" rx="12" fill="#1C7293"/>
  <text x="610" y="175" font-size="18" font-weight="bold" text-anchor="middle" fill="#FFFFFF">SPARK</text>
  <text x="610" y="195" font-size="11" font-style="italic" text-anchor="middle" fill="#D4ECF2">compute</text>
  <text x="610" y="225" font-size="11" text-anchor="middle" fill="#EAF6FA">cast → clean → enrich</text>
  <text x="610" y="245" font-size="11" text-anchor="middle" fill="#EAF6FA">→ aggregate (12 questions)</text>
  <text x="610" y="272" font-size="11" text-anchor="middle" fill="#B8E4EF">common.py</text>
  <text x="610" y="290" font-size="11" text-anchor="middle" fill="#B8E4EF">03_analysis.py</text>
  <text x="610" y="308" font-size="11" text-anchor="middle" fill="#B8E4EF">05_insight_deepdive.py</text>
  <line x1="720" y1="230" x2="775" y2="230" stroke="#5B6472" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- hive -->
  <rect x="780" y="140" width="220" height="180" rx="12" fill="#3E7CA6"/>
  <text x="890" y="175" font-size="18" font-weight="bold" text-anchor="middle" fill="#FFFFFF">HIVE</text>
  <text x="890" y="195" font-size="11" font-style="italic" text-anchor="middle" fill="#DCEBF4">serve</text>
  <text x="890" y="225" font-size="11" text-anchor="middle" fill="#F0F6FA">metastore + 12 Parquet</text>
  <text x="890" y="245" font-size="11" text-anchor="middle" fill="#F0F6FA">tables, partitioned by state</text>
  <text x="890" y="272" font-size="11" text-anchor="middle" fill="#C6DFED">04_save_to_hive.py</text>
  <text x="890" y="290" font-size="11" text-anchor="middle" fill="#C6DFED">query_hive.py</text>
  <line x1="1000" y1="230" x2="1055" y2="230" stroke="#5B6472" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- analyst -->
  <rect x="1060" y="180" width="120" height="100" rx="10" fill="#F4F7FA" stroke="#E3E9EF"/>
  <text x="1120" y="222" font-size="14" font-weight="bold" text-anchor="middle" fill="#1B1F2A">SQL</text>
  <text x="1120" y="242" font-size="11" text-anchor="middle" fill="#5B6472">analyst query</text>
  <text x="1120" y="257" font-size="11" text-anchor="middle" fill="#5B6472">no Spark needed</text>

  <!-- medallion strip -->
  <rect x="220" y="360" width="960" height="70" rx="10" fill="#21295C"/>
  <text x="250" y="388" font-size="12" font-weight="bold" fill="#5FB1BF">BRONZE</text>
  <text x="250" y="406" font-size="10" fill="#C9D3E0">raw, as received</text>
  <text x="530" y="388" font-size="12" font-weight="bold" fill="#5FB1BF">SILVER</text>
  <text x="530" y="406" font-size="10" fill="#C9D3E0">cleaned &amp; typed</text>
  <text x="810" y="388" font-size="12" font-weight="bold" fill="#5FB1BF">GOLD</text>
  <text x="810" y="406" font-size="10" fill="#C9D3E0">business-ready aggregates</text>
  <line x1="500" y1="370" x2="500" y2="420" stroke="#3A4680" stroke-width="1"/>
  <line x1="780" y1="370" x2="780" y2="420" stroke="#3A4680" stroke-width="1"/>

  <text x="600" y="345" font-size="11" text-anchor="middle" fill="#5B6472" font-style="italic">on-disk data layers, written by the Spark stage</text>
</svg>
